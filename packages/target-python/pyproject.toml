[project]
name = "graft-target-python"
version = "0.0.0"
description = "graft Python target. Reads IR JSON on stdin, writes a file manifest on stdout."
requires-python = ">=3.10"
license = "MIT"

[project.scripts]
graft-target-python = "graft_target_python.__main__:cli"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/graft_target_python"]

[tool.ruff]
line-length = 100
target-version = "py310"

[tool.ruff.lint]
select = ["E", "F", "I", "N", "UP", "B", "SIM", "RUF"]

[tool.mypy]
python_version = "3.10"
strict = true

[tool.ruff.lint.per-file-ignores]
"tests/*" = ["ANN", "E501", "S101", "S106", "N802"]

[tool.pytest.ini_options]
testpaths = ["tests"]
