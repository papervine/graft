[project]
name = "graft-runtime"
version = "0.0.0"
description = "Hand-written Python runtime vendored into generated SDKs."
requires-python = ">=3.10"
license = "MIT"
dependencies = ["httpx>=0.27", "pydantic>=2.7", "anyio>=4"]

[project.optional-dependencies]
dev = ["pytest>=8", "pytest-asyncio>=0.24", "mypy>=1.11", "ruff>=0.6"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/graft_runtime"]

[tool.ruff]
line-length = 100
target-version = "py310"

[tool.ruff.lint]
select = ["E", "F", "I", "N", "UP", "B", "SIM", "RUF", "ANN", "S"]
ignore = ["ANN401"]

[tool.ruff.lint.per-file-ignores]
# Tests assert, annotate loosely, and are full of fake credentials — `S105`/`S106` flag every
# `token="tok_123"` fixture as a hardcoded secret, which is exactly what a test fixture is. `B017`
# allows `pytest.raises(Exception)` where the assertion under test is only "it raised at all".
"tests/*" = ["ANN", "B017", "E501", "S101", "S105", "S106"]

[tool.mypy]
python_version = "3.10"
strict = true
warn_unreachable = true

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
