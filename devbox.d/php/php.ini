[php]

; Put your php.ini directives here. For the latest default php.ini file, see https://github.com/php/php-src/blob/master/php.ini-production

; PHPStan's level-9 analysis of the hand-written runtime exhausts the stock 128M CLI limit
; (it crashes mid-parse). 512M gives it headroom without being unbounded.
memory_limit = 512M
; expose_php = Off
