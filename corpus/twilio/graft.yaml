# graft configuration for Twilio - Api
#
# Generated by `graft init`. Inferred values are written out explicitly rather than
# left implicit, so you can see and override every judgment graft made.
#
# Lines marked REVIEW encode knowledge only the API owner has. graft cannot infer them
# from the spec, and leaving them wrong produces an SDK that compiles but misleads.

spec: corpus/twilio/spec.yaml
name: Twilio - Api

# Every target, not just TypeScript.
#
# Twilio was a TypeScript-only corpus SDK, and that asymmetry hid four build-breaking bugs — a required
# `unknown` field in .NET, and three decode-narrowing bugs in PHP. Each appeared the first time this spec
# was generated in that language, and no gate could have found them earlier because the gate never ran on
# that pairing. A corpus entry only exercises the targets it is generated in (SPEC.md §7).
#
# `command` runs each target out of this checkout, relative to the repository root.
targets:
  typescript:
    out: sdks/twilio
    packageName: "@twilio-api/sdk"
  python:
    out: sdks/twilio-python
    packageName: twilio_api
    command:
      - packages/runtime-python/.venv/bin/python
      - -c
      - 'import sys, pathlib; sys.path.insert(0, str(pathlib.Path("packages/target-python/src").resolve())); from graft_target_python.__main__ import main; sys.exit(main(sys.argv[1:]))'
  go:
    out: sdks/twilio-go
    packageName: twilioapi
    modulePath: github.com/twilio/twilio-api-go
    command:
      - packages/target-go/bin/graft-target-go
  php:
    out: sdks/twilio-php
    packageName: twilio/api-sdk
    command:
      - packages/target-php/bin/graft-target-php
  java:
    out: sdks/twilio-java
    packageName: com.twilio:api-sdk
    command:
      - packages/target-java/bin/graft-target-java
  dotnet:
    out: sdks/twilio-dotnet
    packageName: Twilio.ApiSdk
    command:
      - packages/target-dotnet/bin/graft-target-dotnet

# [P001] 61 operations return a collection with paging parameters.
pagination:
  default:
    style: cursor
    limit: PageSize
    page: Page
    cursor: PageToken
    items: "body:accounts"

# [M001] Schemas used as both request and response bodies are split, so write
#        methods stop accepting server-owned fields.
