# Normalizer rules. These are graft defaults, written out so they are visible.
normalize:
  phpEmptyMap: true       # [T001] collapse `object | array maxItems:0` to a map
  scalarUnion: widen      # [T002] `string | integer` stays a union rather than coercing
  constHeaderHoist: true  # [H001] see headers.constant below
